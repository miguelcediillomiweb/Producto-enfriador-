<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Peñafiel - Ruta 1371</title>
  <meta name="description" content="Conoce todas las marcas que maneja Grupo Peñafiel - Ruta 1371.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="season-layer" aria-hidden="true"></div>
  <div id="loader-screen">
    <img src="productos.jpg" alt="Productos Grupo Peñafiel" class="loader-image" onerror="this.style.display='none'">
    <div class="progress-container"><div class="progress-bar"></div></div>
    <p class="loader-text">
      <span class="animated-emoji">✨</span>
      Gracias por atreverte a conocer más de Grupo Peñafiel
      <span class="animated-emoji">🥤</span>
      <span class="animated-emoji">🌟</span>
    </p>
  </div>
  <main id="main-content">
    <section class="greeting-card">
      <h1 class="greeting-title" id="greeting-text"></h1>
      <p class="greeting-subtitle">Te damos la bienvenida a <strong>Grupo Peñafiel</strong> y la <strong>Ruta 1371</strong> <span class="animated-emoji">🚚</span></p>
    </section>
    <section class="block">
      <h2 class="section-title"><span class="animated-emoji">🎉</span> Nuestras marcas <span class="animated-emoji">🌈</span></h2>
      <div id="brand-circles" class="brand-circles"></div>
    </section>
    <section class="block">
      <h2 class="section-title"><span class="animated-emoji">🍾</span> Todo lo que manejamos <span class="animated-emoji">⚡</span></h2>
      <div id="brand-banners" class="brand-banners"></div>
    </section>
    <section class="block" id="news-section" hidden>
      <h2 class="section-title"><span class="animated-emoji">🆕</span> Novedades <span class="animated-emoji">🎁</span></h2>
      <div id="news-list" class="news-list"></div>
    </section>
  </main>
  <footer>
    <div class="footer-brand"><span>Creado por Grupo Peñafiel y Ruta 1371 con todo el</span><span class="animated-emoji">❤️</span></div>
    <div class="footer-copyright">Designed and Created by Miguel Cedillo 1371 © 2026 <span class="animated-emoji">🚀</span></div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
